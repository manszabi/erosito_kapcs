# XcodeGen projektleíró: ebből készül az Xcode-projekt (GitHub Actions-ben vagy Mac-en: xcodegen generate)
name: Erosito
options:
  bundleIdPrefix: hu.erosito
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Erosito:
    type: application
    platform: iOS
    sources:
      - path: Erosito
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Erősítő
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSLocalNetworkUsageDescription: Az erősítő-bekapcsoló megkereséséhez és vezérléséhez a helyi hálózaton.
        NSBonjourServices: [_erosito._tcp]
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: hu.erosito.app
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
    scheme: {}
